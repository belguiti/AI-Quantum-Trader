server:
  port: 8085

spring:
  application:
    name: auth-service
  config:
    import: optional:vault://
  cloud:
    vault:
      host: localhost
      port: 8200
      scheme: http
      authentication: TOKEN
      token: ${VAULT_TOKEN:ai-quantum-root-token}
      kv:
        enabled: true
        backend: secret
        default-context: ai-quantum
        application-name: auth-service
  datasource:
    url: jdbc:sqlserver://localhost:1434;databaseName=TradeDB;encrypt=true;trustServerCertificate=true;createDatabaseIfNotExist=true
    username: sa
    password: ${SA_PASSWORD:SqlStrongPass2026}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:bXlTdXBlclNlY3VyZUp3dFNlY3JldEtleUZvckFJUXVhbnR1bVRyYWRlcjIwMjY=}
      expiration: 86400000 # 1 day
      refresh-token:
        expiration: 604800000 # 7 days

