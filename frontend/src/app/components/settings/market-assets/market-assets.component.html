<div class="container mx-auto p-6 text-gray-200">
    <div class="flex justify-between items-center mb-8">
        <h2
            class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-green-400 bg-clip-text text-transparent animate-pulse">
            Market Scanners
        </h2>
        <button (click)="showAddModal = true"
            class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg shadow-lg hover:shadow-blue-500/50 transition-all duration-300 transform hover:-translate-y-1">
            + Add Asset
        </button>
    </div>

    <!-- Loading Skeleton -->
    <div *ngIf="isLoading" class="space-y-4 animate-pulse">
        <div class="h-12 bg-gray-800 rounded-lg w-full"></div>
        <div class="h-12 bg-gray-800 rounded-lg w-full"></div>
        <div class="h-12 bg-gray-800 rounded-lg w-full"></div>
    </div>

    <!-- Assets Grid -->
    <div *ngIf="!isLoading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div *ngFor="let asset of assets"
            class="bg-gray-800/50 backdrop-blur-md border border-gray-700 rounded-xl p-5 hover:border-blue-500/50 transition-all duration-300 group relative overflow-hidden">

            <!-- Asset Class Icon/Badge -->
            <div class="absolute top-0 right-0 p-2">
                <span [ngClass]="{
          'bg-yellow-500/20 text-yellow-400': asset.assetClass === 'CRYPTO',
          'bg-green-500/20 text-green-400': asset.assetClass === 'FOREX',
          'bg-purple-500/20 text-purple-400': asset.assetClass === 'INDEX',
          'bg-orange-500/20 text-orange-400': asset.assetClass === 'COMMODITY'
        }" class="text-xs font-bold px-2 py-1 rounded-full uppercase tracking-wider backdrop-blur-sm">
                    {{ asset.assetClass }}
                </span>
            </div>

            <div class="flex items-center space-x-4">
                <div class="bg-gray-700/50 p-3 rounded-full group-hover:bg-gray-700 transition-colors">
                    <i class="fas fa-chart-line text-2xl text-blue-400"></i>
                </div>
                <div>
                    <h3 class="text-xl font-bold text-white">{{ asset.symbol }}</h3>
                    <p class="text-sm text-gray-400">{{ asset.brokerSymbol }}</p>
                </div>
            </div>

            <div class="mt-6 flex justify-between items-center">
                <!-- Toggle Switch -->
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" [checked]="asset.isActive" (change)="toggleAsset(asset)"
                        class="sr-only peer">
                    <div
                        class="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500 peer-checked:shadow-[0_0_10px_rgba(34,197,94,0.5)]">
                    </div>
                    <span class="ml-3 text-sm font-medium"
                        [ngClass]="asset.isActive ? 'text-green-400' : 'text-gray-500'">
                        {{ asset.isActive ? 'Active' : 'Inactive' }}
                    </span>
                </label>

                <button (click)="deleteAsset(asset.id)"
                    class="text-red-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Add Modal -->
    <div *ngIf="showAddModal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity duration-300">
        <div
            class="bg-gray-900 border border-gray-700 rounded-2xl p-8 w-full max-w-md shadow-2xl transform scale-100 transition-transform">
            <h3 class="text-2xl font-bold mb-6 text-white text-center">Add Market Asset</h3>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Display Symbol (e.g. BTCUSD)</label>
                    <input [(ngModel)]="newAsset.symbol"
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                        placeholder="BTCUSD">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Broker Symbol (MT5) (e.g.
                        BTCUSD.m)</label>
                    <input [(ngModel)]="newAsset.brokerSymbol"
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                        placeholder="BTCUSD.m">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Asset Class</label>
                    <select [(ngModel)]="newAsset.assetClass"
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                        <option *ngFor="let cls of assetClasses" [value]="cls">{{ cls }}</option>
                    </select>
                </div>
            </div>

            <div class="flex space-x-4 mt-8">
                <button (click)="showAddModal = false"
                    class="flex-1 px-4 py-3 rounded-xl border border-gray-600 text-gray-300 hover:bg-gray-800 transition-colors">
                    Cancel
                </button>
                <button (click)="addAsset()"
                    class="flex-1 px-4 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold shadow-lg hover:shadow-blue-500/50 transition-all">
                    Save Asset
                </button>
            </div>
        </div>
    </div>
</div>
