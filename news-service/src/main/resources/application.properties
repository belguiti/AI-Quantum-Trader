spring.application.name=news-service
server.port=8086

# Vault Configuration
spring.config.import=optional:vault://
spring.cloud.vault.host=localhost
spring.cloud.vault.port=8200
spring.cloud.vault.scheme=http
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=${VAULT_TOKEN:ai-quantum-root-token}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=ai-quantum
spring.cloud.vault.kv.application-name=news-service

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:changeme}
spring.ai.openai.chat.options.model=gpt-4o

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=news-group

# Redis Configuration (Optional for now, fallback to simple cache)
spring.cache.type=simple